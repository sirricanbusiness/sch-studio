<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elde Var Support</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.24), transparent 34%),
        linear-gradient(135deg, #020617, #0f172a 55%, #111827);
      color: #e2e8f0;
      line-height: 1.7;
      min-height: 100vh;
    }

    .container {
      max-width: 820px;
      margin: 40px auto;
      padding: 40px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(59, 130, 246, 0.24);
      border-radius: 30px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 28px;
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      color: white;
      text-decoration: underline;
    }

    .logo-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      width: 132px;
      height: 132px;
      border-radius: 32px;
      background: rgba(37, 99, 235, 0.34);
      filter: blur(24px);
    }

    .logo {
      position: relative;
      width: 104px;
      height: 104px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow:
        0 18px 38px rgba(37, 99, 235, 0.42),
        0 8px 22px rgba(0, 0, 0, 0.42);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 40px;
      line-height: 1.1;
      color: white;
      letter-spacing: -1px;
    }

    .subtitle {
      max-width: 620px;
      margin: 0 auto 30px;
      color: #cbd5e1;
      font-size: 17px;
    }

    .support-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 30px;
      text-align: left;
    }

    .support-form label {
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: -8px;
    }

    .support-form input,
    .support-form textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(59, 130, 246, 0.28);
      border-radius: 14px;
      padding: 14px 15px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .support-form input:focus,
    .support-form textarea:focus {
      border-color: rgba(96, 165, 250, 0.85);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.16);
    }

    .support-form textarea {
      resize: vertical;
      min-height: 140px;
    }

    .support-form input::placeholder,
    .support-form textarea::placeholder {
      color: #64748b;
    }

    .support-form button {
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 15px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s;
      box-shadow: 0 14px 32px rgba(37, 99, 235, 0.28);
    }

    .support-form button:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 18px 40px rgba(37, 99, 235, 0.38);
    }

    .email-box {
      margin: 30px auto 0;
      padding: 18px;
      background: rgba(30, 41, 59, 0.82);
      border: 1px solid rgba(59, 130, 246, 0.18);
      border-radius: 18px;
      color: #cbd5e1;
    }

    .email-box a {
      color: #60a5fa;
      font-weight: 700;
      text-decoration: none;
    }

    .email-box a:hover {
      color: white;
      text-decoration: underline;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #94a3b8;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      padding-top: 20px;
    }

    @media (max-width: 640px) {
      .container {
        margin: 0;
        min-height: 100vh;
        border-radius: 0;
        padding: 28px 22px;
      }

      h1 {
        font-size: 30px;
      }

      .logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
      }

      .logo-wrap::before {
        width: 112px;
        height: 112px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <a class="back-link" href="index.html">← Back to Home</a>

    <div class="logo-wrap">
      <img class="logo" src="elde-var-logo.png" alt="Elde Var" />
    </div>

    <h1>Elde Var Support</h1>

    <p class="subtitle">
      Need help, want to report a bug, or have feedback? Send us a message directly using the form below.
    </p>

    <form
      action="https://formsubmit.co/support@schstudio.dev"
      method="POST"
      class="support-form"
    >
      <input type="hidden" name="_subject" value="Elde Var Support Request" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_next" value="https://eldevar.schstudio.dev/support.html" />

      <label for="name">Name</label>
      <input
        id="name"
        type="text"
        name="name"
        placeholder="Your name"
        required
      />

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        placeholder="your@email.com"
        required
      />

      <label for="device">Device</label>
      <input
        id="device"
        type="text"
        name="device"
        placeholder="iPhone 13, iOS 18, etc. (optional)"
      />

      <label for="appVersion">App Version</label>
      <input
        id="appVersion"
        type="text"
        name="app_version"
        placeholder="1.0, 1.1, etc. (optional)"
      />

      <label for="message">Message</label>
      <textarea
        id="message"
        name="message"
        placeholder="Describe your issue or feedback..."
        required
      ></textarea>

      <button type="submit">
        Send Message
      </button>
    </form>

    <div class="email-box">
      You can also contact us directly at
      <a href="mailto:support@schstudio.dev">support@schstudio.dev</a>
    </div>

    <p class="footer">
      SCH Studio · Elde Var · We aim to respond within 48 hours.
    </p>
  </main>
</body>
</html>
