<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elde Var Support</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
      line-height: 1.7;
    }

    .container {
      max-width: 760px;
      margin: 60px auto;
      padding: 36px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 34px;
      color: #111827;
    }

    p {
      color: #4b5563;
      font-size: 17px;
    }

    .email-box {
      margin: 28px auto;
      padding: 18px;
      background: #f3f4f6;
      border-radius: 12px;
      display: inline-block;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 28px;
      font-size: 14px;
      color: #6b7280;
    }

    @media (max-width: 640px) {
      .container {
        margin: 0;
        min-height: 100vh;
        border-radius: 0;
        padding: 28px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Elde Var Support</h1>

    <p>If you need assistance, want to report a bug, or provide feedback, please contact us.</p>

    <div class="email-box">
      <a href="mailto:support@schstudio.dev">support@schstudio.dev</a>
    </div>

    <p>We aim to respond within 48 hours.</p>

    <p class="footer">SCH Studio · Elde Var</p>
  </main>
</body>
</html>
